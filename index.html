<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licență TST - WebRTC Pro</title>
    <style>
        /* --- STILURI GENERALE --- */
        body {
            background-color: #202124;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- LOBBY (ECRAN DE START) --- */
        #lobby-container {
            text-align: center;
            background: #292a2d;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #3c4043;
            max-width: 400px;
            width: 90%;
        }
        input, select {
            padding: 12px; border-radius: 5px; border: 1px solid #5f6368;
            background: #202124; color: white; width: 100%; margin-bottom: 15px;
            display: block; box-sizing: border-box;
        }
        label { display: block; text-align: left; margin-bottom: 5px; color: #bdc1c6; font-size: 14px; }
        .join-btn {
            background-color: #8ab4f8; color: #202124; padding: 15px; font-size: 18px; font-weight: bold;
            border: none; border-radius: 50px; cursor: pointer; width: 100%; margin-top: 10px;
        }
        .join-btn:hover { background-color: #aecbfa; }

        /* --- INTERFAȚA DE APEL --- */
        #call-interface {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100vh;
            justify-content: center;
            position: relative;
        }

        /* HEADER (Titlu și Timer) */
        .header-info {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px;
        }
        .header-info h1 { margin: 0; font-size: 18px; }
        .timer-badge {
            font-family: 'Courier New', monospace; font-size: 18px; color: #00e676;
            margin-top: 5px; display: inline-block;
        }

        /* --- WIDGET RETEA (DREAPTA SUS) --- */
        #network-widget {
            position: absolute; top: 20px; right: 20px;
            background: rgba(41, 42, 45, 0.95); padding: 15px;
            border-radius: 10px; border: 1px solid #5f6368;
            width: 220px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 13px; z-index: 50; display: none; transition: opacity 0.3s;
        }
        #network-widget h3 { margin: 0 0 10px 0; font-size: 14px; color: #8ab4f8; border-bottom: 1px solid #5f6368; padding-bottom: 5px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .stat-val { font-family: monospace; color: #00e676; font-weight: bold; }

        /* --- VIDEO CONTAINER --- */
        .video-container {
            display: flex; gap: 20px; padding: 20px;
            flex-wrap: wrap; justify-content: center; align-items: center;
        }
        .video-wrapper {
            position: relative; width: 480px; height: 360px;
            background: #000; border-radius: 12px; border: 2px solid #3c4043;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { transform: scaleX(-1); }
        .no-mirror { transform: scaleX(1) !important; }

        /* Overlay-uri (Status) */
        .status-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #202124; align-items: center; justify-content: center;
            flex-direction: column; z-index: 2;
        }
        .mute-icon {
            display: none; position: absolute; top: 10px; right: 10px; background: #d93025;
            color: white; width: 30px; height: 30px; border-radius: 50%;
            align-items: center; justify-content: center; z-index: 3;
        }
        .name-tag { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; font-size: 12px; }

        /* --- CONTROLS (BARA DE JOS) --- */
        .controls {
            position: absolute; bottom: 30px;
            background: rgba(41, 42, 45, 0.9);
            padding: 10px 20px; border-radius: 50px;
            display: flex; gap: 10px; border: 1px solid #5f6368;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 100;
        }
        button {
            background-color: #3c4043; color: white; border: none; padding: 12px 20px;
            font-size: 16px; border-radius: 50px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        button:hover { background-color: #5f6368; transform: translateY(-2px); }
        #callBtn { background-color: #00796b; }
        .hangup-btn { background-color: #d93025 !important; }
        .btn-off { background-color: #d93025 !important; }

        /* --- CHAT --- */
        .chat-container {
            position: fixed; bottom: 20px; right: 20px; width: 320px; height: 400px;
            background-color: #292a2d; border-radius: 10px; display: flex;
            flex-direction: column; border: 1px solid #5f6368; z-index: 200;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }
        .chat-header { padding: 10px; background: #202124; border-bottom: 1px solid #3c4043; display:flex; justify-content:space-between; align-items:center; border-radius: 10px 10px 0 0; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #3c4043; align-items: center; }
        .chat-input-area input[type="text"] { margin-bottom: 0; flex: 1; }
        .message { padding: 8px 12px; border-radius: 8px; max-width: 85%; font-size: 13px; word-wrap: break-word; }
        .my-msg { background-color: #00796b; align-self: flex-end; }
        .remote-msg { background-color: #3c4043; align-self: flex-start; }

        /* Panel Setări */
        #settings-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #292a2d; border: 1px solid #5f6368; padding: 25px; border-radius: 15px; z-index: 300; box-shadow: 0 20px 50px rgba(0,0,0,0.8); width: 300px; }
    </style>
</head>
<body>

    <div id="lobby-container">
        <h1>👋 Configurare</h1>
        <label>Nume cameră:</label>
        <input type="text" id="roomInput" placeholder="ex: licenta1" value="test">
        <label>📷 Cameră:</label>
        <select id="videoSourceLobby"></select>
        <label>🎙️ Microfon:</label>
        <select id="audioSourceLobby"></select>
        <button class="join-btn" onclick="joinRoom()">Conectare</button>
    </div>

    <div id="call-interface">
        
        <div class="header-info">
            <h1>Cameră: <span id="roomNameDisplay" style="color:#8ab4f8"></span></h1>
            <div id="callTimer" class="timer-badge">00:00</div>
        </div>

        <div id="network-widget">
            <h3>📊 Statistici Conexiune</h3>
            <div class="stat-row"><span>Bitrate:</span> <span id="stat-bitrate" class="stat-val">0 kbps</span></div>
            <div class="stat-row"><span>Rezoluție:</span> <span id="stat-res" class="stat-val">0x0</span></div>
            <div class="stat-row"><span>FPS:</span> <span id="stat-fps" class="stat-val">0</span></div>
            <div class="stat-row"><span>Pierderi:</span> <span id="stat-loss" class="stat-val" style="color:orange">0</span></div>
        </div>

        <div class="video-container">
            <div class="video-wrapper">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="name-tag">Eu (Local)</div>
                <div id="camera-off-overlay" class="status-overlay"><span style="font-size:40px">📷</span><p>Cameră Oprită</p></div>
                <div id="mic-off-icon" class="mute-icon">🔇</div>
            </div>

            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="name-tag">Partener (Remote)</div>
                <div id="remote-camera-off-overlay" class="status-overlay"><span style="font-size:40px">📷</span><p>Cameră Oprită</p></div>
                <div id="remote-mic-off-icon" class="mute-icon">🔇</div>
            </div>
        </div>

        <div class="controls">
            <button id="camBtn" onclick="toggleCamera()" title="Pornește/Oprește Camera">📹</button>
            <button id="micBtn" onclick="toggleMic()" title="Activează/Dezactivează Microfonul">🎙️</button>
            <button id="shareBtn" onclick="toggleScreenShare()" style="display: none;" title="Partajează Ecranul cu partenerul">🖥️</button>
            <button id="recordBtn" onclick="toggleRecording()" style="display: none;" title="Înregistrează tot ecranul">⏺️</button>
            <button id="settingsBtn" onclick="toggleSettings()" style="display: none;" title="Schimbă Cameră/Microfon">⚙️</button>
            <button id="callBtn" onclick="handleCallButton()" title="Inițiază sau Încheie apelul">📞 Apel</button>
            <button id="chatBtn" onclick="toggleChatUI()" style="display: none;" title="Deschide Chat-ul">💬</button>
        </div>

        <div id="settings-panel">
            <h3 style="margin-top:0; text-align:center;">Setări Dispozitive</h3>
            <label>📷 Schimbă Camera:</label><select id="videoSourceCall" onchange="changeCamera()"></select>
            <label style="margin-top:10px;">🎙️ Schimbă Microfon:</label><select id="audioSourceCall" onchange="changeMic()"></select>
            <button onclick="toggleSettings()" style="width:100%; margin-top:20px; justify-content:center; background:#5f6368;">Închide</button>
        </div>

    </div>

    <div id="chat-container" class="chat-container" style="display: none;">
        <div class="chat-header">
            <span style="font-weight:bold;">Mesaje</span>
            <button onclick="toggleChatUI()" style="background:none; border:none; padding:0; font-size:14px;">✖</button>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="file" id="fileInput" style="display: none;" onchange="sendFile()">
            <button onclick="document.getElementById('fileInput').click()" style="padding: 8px; margin-right: 5px; background: #5f6368; border-radius: 5px;" title="Atașează Fișier">📎</button>
            <input type="text" id="msgInput" placeholder="Scrie un mesaj..." onkeypress="handleKeyPress(event)">
            <button onclick="sendTextMessage()" style="padding: 8px 12px; margin-left: 5px; background: #00796b; border-radius: 5px;" title="Trimite">➤</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
